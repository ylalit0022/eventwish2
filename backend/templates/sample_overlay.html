<!-- User Profile Overlay -->
<div class="user-profile">
    <!-- User Photo with Fallback -->
    <img class="user-photo" src="{{userPhoto}}" alt="{{userName}}">
    
    <!-- User Name with Optional Badge -->
    <div class="user-info">
        <span class="user-name">{{userName}}</span>
        <span class="user-badge" data-user-id="[USER_ID]">✓</span>
    </div>
</div>
