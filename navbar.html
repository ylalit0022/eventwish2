<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Navbar</title>
    <style>
        /* Reset default styles */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* Basic styling for the body */
        body {
            font-family: Arial, sans-serif;
            line-height: 1.6;
        }

        /* Navbar container */
        .navbar {
            background-color: #333;
            padding: 1rem;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }

        /* Navigation list */
        .nav-list {
            list-style: none;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 2rem;
        }

        /* Navigation links */
        .nav-list a {
            color: white;
            text-decoration: none;
            font-size: 1.1rem;
            padding: 0.5rem 1rem;
            border-radius: 4px;
            transition: background-color 0.3s ease;
        }

        /* Hover effect */
        .nav-list a:hover {
            background-color: #555;
        }

        /* Active link */
        .nav-list a.active {
            background-color: #4CAF50;
        }

        /* Main content area */
        .content {
            padding: 2rem;
            text-align: center;
        }
    </style>
</head>
<body>
    <!-- Navigation bar -->
    <nav class="navbar">
        <ul class="nav-list">
            <li><a href="#" class="active">Home</a></li>
            <li><a href="#">About</a></li>
            <li><a href="#">Services</a></li>
            <li><a href="#">Portfolio</a></li>
            <li><a href="#">Contact</a></li>
        </ul>
    </nav>

    <!-- Main content area -->
    <div class="content">
        <h1>Welcome to the Website</h1>
        <p>This is a simple navbar example.</p>
    </div>
</body>
</html>
