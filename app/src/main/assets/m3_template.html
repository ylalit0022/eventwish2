<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EventWish</title>
    <link rel="stylesheet" href="m3_styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="wish-card">
        <div class="card-header">
            <span class="icon">🎉</span>
            <h1>A Special Wish For You</h1>
        </div>
        <div class="card-body">
            <p class="recipient-name">Dear [Recipient Name],</p>
            <p>Wishing you a day filled with joy, laughter, and unforgettable moments. May this special occasion bring you everything you've been hoping for!</p>
            <p>Thinking of you always.</p>
        </div>
        <div class="card-footer">
            <p>With love,</p>
            <p class="sender-name">[Sender Name]</p>
        </div>
    </div>
</body>
</html>
