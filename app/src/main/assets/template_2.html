<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EventWish - Cool Blue</title>
    <link rel="stylesheet" href="styles_2.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600&display=swap" rel="stylesheet">
</head>
<body>
    <div class="wish-card">
        <div class="card-header">
            <span class="icon">✨</span>
            <h1>A Wish For You</h1>
        </div>
        <div class="card-body">
            <p class="recipient-name">Dear [Recipient Name],</p>
            <p>Hope your day is as wonderful and unique as you are. Sending you the biggest congratulations on your special day!</p>
        </div>
        <div class="card-footer">
            <p>Best wishes,</p>
            <p class="sender-name">[Sender Name]</p>
        </div>
    </div>
</body>
</html>
