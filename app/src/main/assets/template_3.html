<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EventWish - Lush Green</title>
    <link rel="stylesheet" href="styles_3.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Lato:wght@400&display=swap" rel="stylesheet">
</head>
<body>
    <div class="wish-card">
        <div class="card-header">
            <span class="icon">🌿</span>
            <h1>A Note of Celebration</h1>
        </div>
        <div class="card-body">
            <p class="recipient-name">Dearest [Recipient Name],</p>
            <p>On this beautiful day, I'm sending you a little note to say how much you're celebrated. May your path be green and your heart be full.</p>
        </div>
        <div class="card-footer">
            <p>Warmly,</p>
            <p class="sender-name">[Sender Name]</p>
        </div>
    </div>
</body>
</html>
